# The gateway creates and deletes box pods (box-<id>) in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dosbox-gateway
  labels:
    {{- include "dosbox.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dosbox-gateway
  labels:
    {{- include "dosbox.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dosbox-gateway
  labels:
    {{- include "dosbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dosbox-gateway
subjects:
  - kind: ServiceAccount
    name: dosbox-gateway
---
# The shared volume: one folder per box (<id>/ = its /data, <id>/c = C:).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dosbox-boxes
  labels:
    {{- include "dosbox.labels" . | nindent 4 }}
  annotations:
    # Users' C: drives: never deleted with the release.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.gateway.boxes.storageClass }}
  resources:
    requests:
      storage: {{ .Values.gateway.boxes.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dosbox-gateway
  labels:
    app: dosbox-gateway
    {{- include "dosbox.labels" . | nindent 4 }}
spec:
  # One replica with Recreate: it keeps viewer counts in memory and mounts
  # the ReadWriteOnce boxes volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dosbox-gateway
  template:
    metadata:
      labels:
        app: dosbox-gateway
        # Shared with every box pod: all of them must run on the node the
        # boxes volume is attached to. Whichever starts first picks it.
        dosbox/storage: boxes
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: dosbox-gateway
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  dosbox/storage: boxes
              topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway
          image: {{ include "dosbox.image" (dict "root" . "image" .Values.images.platform) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["/app/gateway"]
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            - name: HTTP_SERVICE_PORT
              value: "{{ .Values.gateway.port }}"
            - name: GATEWAY_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: postgresUrl
            - name: AUTH_SERVER_URL
              value: "http://dosbox-auth:{{ .Values.auth.port }}/auth"
            - name: AUTH_TOKEN_ISSUER
              value: "{{ .Values.auth.tokenIssuer }}"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BOXES_DIR
              value: /boxes
            - name: BOXES_PVC
              value: dosbox-boxes
            - name: BOX_DOSBOX_IMAGE
              value: {{ include "dosbox.image" (dict "root" . "image" .Values.images.dosbox) }}
            - name: BOX_STREAM_IMAGE
              value: {{ include "dosbox.image" (dict "root" . "image" .Values.images.stream) }}
            - name: BOX_IMAGE_PULL_POLICY
              value: {{ .Values.images.pullPolicy }}
            - name: BOX_PULL_SECRET
              value: {{ (first .Values.imagePullSecrets).name }}
            - name: BOX_DISK_LIMIT_MB
              value: "{{ .Values.gateway.limits.diskMB }}"
            - name: BOX_IDLE_MINUTES
              value: "{{ .Values.gateway.limits.idleMinutes }}"
            - name: MAX_BOXES_PER_USER
              value: "{{ .Values.gateway.limits.boxesPerUser }}"
            - name: MAX_RUNNING_PER_USER
              value: "{{ .Values.gateway.limits.runningPerUser }}"
            - name: MAX_RUNNING_TOTAL
              value: "{{ .Values.gateway.limits.runningTotal }}"
            # The catalog: unpacked on the boxes volume, master copies in
            # Spaces. Without the optional key the catalog is volume only.
            - name: CATALOG_MAX_ITEM_MB
              value: "{{ .Values.gateway.catalog.maxItemMB }}"
            - name: SPACES_ENDPOINT
              value: "{{ .Values.gateway.catalog.spacesEndpoint }}"
            - name: SPACES_BUCKET
              value: "{{ .Values.gateway.catalog.spacesBucket }}"
            - name: SPACES_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: spacesKey
                  optional: true
            - name: SPACES_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: spacesSecret
                  optional: true
          volumeMounts:
            - name: boxes
              mountPath: /boxes
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: boxes
          persistentVolumeClaim:
            claimName: dosbox-boxes
---
apiVersion: v1
kind: Service
metadata:
  name: dosbox-gateway
  labels:
    app: dosbox-gateway
    {{- include "dosbox.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: dosbox-gateway
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
---
# Box pods run arbitrary user DOS software: only the gateway may reach them
# (player socket + control API on :8080), and they reach nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dosbox-boxes
  labels:
    {{- include "dosbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dosbox-box
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dosbox-gateway
      ports:
        - port: 8080
  egress: []
