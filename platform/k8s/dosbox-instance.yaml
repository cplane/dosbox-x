# One dos-box instance. The platform will template this per allocation
# (name, owner label, PVC); for now it is a single hand-applied test box.
#
#   kubectl -n dosbox apply -f platform/k8s/dosbox-instance.yaml
#   kubectl -n dosbox exec dosbox-test -c dosbox -- gl-snap
#   kubectl -n dosbox port-forward pod/dosbox-test 8080:8080   # player at http://localhost:8080/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dosbox-test-data
  namespace: dosbox
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: dosbox-test
  namespace: dosbox
  labels:
    app: dosbox
    dosbox/instance: test
spec:
  imagePullSecrets:
    - name: container-registry-ams3
  restartPolicy: Always
  containers:
    - name: dosbox
      image: registry.digitalocean.com/container-registry-ams3/dosbox-x-debug:latest  # debugger + RPC agent
      imagePullPolicy: Always
      resources:
        requests: {cpu: 250m, memory: 128Mi}
        limits: {cpu: "1", memory: 512Mi}
      volumeMounts:
        - {name: data, mountPath: /data}
        - {name: shm, mountPath: /dev/shm}
    # Reads frames from /dev/shm/DWD_GAMELINK_MMAP_R4 and writes input back;
    # serves the player + WebSocket + control API on :8080. Mounts the C:
    # drive (/data/c on the PVC) for PUT/GET /files.
    - name: stream
      image: registry.digitalocean.com/container-registry-ams3/dosbox-stream:latest
      imagePullPolicy: Always
      env:
        - {name: JPEG_QUALITY, value: "80"}
        - {name: MAX_FPS, value: "30"}
        - {name: DATA_DIR, value: /data/c}
      ports:
        - {name: http, containerPort: 8080}
      readinessProbe:
        httpGet: {path: /healthz, port: http}
        periodSeconds: 5
      resources:
        requests: {cpu: 100m, memory: 32Mi}
        limits: {cpu: "1", memory: 128Mi}
      volumeMounts:
        - {name: shm, mountPath: /dev/shm}
        - {name: data, mountPath: /data/c, subPath: c}
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: dosbox-test-data
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
