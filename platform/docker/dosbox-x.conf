# Headless dos-box defaults. Frames and input go through Game Link shared
# memory (/dev/shm/DWD_GAMELINK_MMAP_R4); a sidecar reads/writes it.

[sdl]
videodriver   = dummy
output        = gamelink
gamelink master = true
fullscreen    = false
autolock      = false
showmenu      = false
priority      = normal,normal
mapperfile    = /data/mapper-dosbox-x.map
# No DOSBox-X shortcuts (Ctrl+F9 = quit, Ctrl+F10, Host+key...): every key
# combination from the browser must reach the DOS program.
hotkeys       = false

[dosbox]
fastbioslogo  = true
startbanner   = false
quit warning  = false
working directory option = noprompt
machine       = svga_s3
memsize       = 16
captures      = /data/capture

[cpu]
core   = auto
cputype = auto
cycles = auto

[mixer]
nosound = true

[render]
aspect = false

# Boxes run arbitrary user software: no network card (the pod also has a
# NetworkPolicy without egress).
[ne2000]
ne2000 = false

[autoexec]
mount c /data/c
c:
