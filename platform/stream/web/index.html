<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dos-box</title>
<style>
  :root { color-scheme: dark; --bg:#0d0f12; --panel:#171a1f; --text:#d7dce2; --muted:#7d8590; --ok:#3fb950; --bad:#f85149; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:16px; }
  #screen-wrap { width:min(100%, 1024px); background:#000; border-radius:6px; overflow:hidden; outline:none; position:relative; }
  #screen-wrap:focus-visible, #screen-wrap.focused { box-shadow:0 0 0 2px var(--accent); }
  canvas { display:block; width:100%; height:auto; image-rendering:pixelated; cursor:default; }
  #hint { position:absolute; inset:auto 0 0 0; text-align:center; padding:6px; font-size:12px; color:var(--muted); background:rgba(0,0,0,.6); pointer-events:none; }
  #screen-wrap.focused #hint { display:none; }
  .bar { width:min(100%, 1024px); display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding:10px 2px; color:var(--muted); font-size:13px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--bad); display:inline-block; margin-right:6px; }
  .dot.on { background:var(--ok); }
  .spacer { flex:1; }
  button { background:var(--panel); color:var(--text); border:1px solid #30363d; border-radius:6px; padding:5px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
</style>
</head>
<body>
<div class="bar">
  <span><span id="dot" class="dot"></span><span id="conn">connecting…</span></span>
  <span id="prog"></span>
  <span id="geom"></span>
  <span id="fps"></span>
  <span class="spacer"></span>
  <button id="mouse">Capture mouse</button>
  <button id="cad">Ctrl+Alt+Del</button>
  <button id="release">Release keys</button>
</div>
<div id="screen-wrap" tabindex="0">
  <canvas id="c" width="720" height="400"></canvas>
  <div id="hint">Click the screen to type · Capture mouse for DOS mouse input · Esc releases the mouse</div>
</div>
<script>
"use strict";
// KeyboardEvent.code -> PC set-1 scancode; 0x80|code for E0-extended keys
// (matches DOSBox-X src/gamelink/scancodes_windows.h).
const SC = {
  Escape:0x01, Digit1:0x02, Digit2:0x03, Digit3:0x04, Digit4:0x05, Digit5:0x06, Digit6:0x07,
  Digit7:0x08, Digit8:0x09, Digit9:0x0A, Digit0:0x0B, Minus:0x0C, Equal:0x0D, Backspace:0x0E, Tab:0x0F,
  KeyQ:0x10, KeyW:0x11, KeyE:0x12, KeyR:0x13, KeyT:0x14, KeyY:0x15, KeyU:0x16, KeyI:0x17, KeyO:0x18, KeyP:0x19,
  BracketLeft:0x1A, BracketRight:0x1B, Enter:0x1C, ControlLeft:0x1D,
  KeyA:0x1E, KeyS:0x1F, KeyD:0x20, KeyF:0x21, KeyG:0x22, KeyH:0x23, KeyJ:0x24, KeyK:0x25, KeyL:0x26,
  Semicolon:0x27, Quote:0x28, Backquote:0x29, ShiftLeft:0x2A, Backslash:0x2B,
  KeyZ:0x2C, KeyX:0x2D, KeyC:0x2E, KeyV:0x2F, KeyB:0x30, KeyN:0x31, KeyM:0x32,
  Comma:0x33, Period:0x34, Slash:0x35, ShiftRight:0x36, NumpadMultiply:0x37, AltLeft:0x38, Space:0x39, CapsLock:0x3A,
  F1:0x3B, F2:0x3C, F3:0x3D, F4:0x3E, F5:0x3F, F6:0x40, F7:0x41, F8:0x42, F9:0x43, F10:0x44,
  NumLock:0x45, ScrollLock:0x46, Numpad7:0x47, Numpad8:0x48, Numpad9:0x49, NumpadSubtract:0x4A,
  Numpad4:0x4B, Numpad5:0x4C, Numpad6:0x4D, NumpadAdd:0x4E, Numpad1:0x4F, Numpad2:0x50, Numpad3:0x51,
  Numpad0:0x52, NumpadDecimal:0x53, IntlBackslash:0x56, F11:0x57, F12:0x58,
  NumpadEnter:0x9C, ControlRight:0x9D, NumpadDivide:0xB5, PrintScreen:0xB7, AltRight:0xB8, Pause:0xC5,
  Home:0xC7, ArrowUp:0xC8, PageUp:0xC9, ArrowLeft:0xCB, ArrowRight:0xCD, End:0xCF,
  ArrowDown:0xD0, PageDown:0xD1, Insert:0xD2, Delete:0xD3, MetaLeft:0xDB, MetaRight:0xDC, ContextMenu:0xDD,
};

// Fallback for events without KeyboardEvent.code (some virtual keyboards
// and automation): e.key -> [scancode, needs Shift] on a US layout.
const KEY = {
  Escape:[0x01], Enter:[0x1C], Tab:[0x0F], Backspace:[0x0E], " ":[0x39], Shift:[0x2A], Control:[0x1D],
  Alt:[0x38], CapsLock:[0x3A], ArrowUp:[0xC8], ArrowDown:[0xD0], ArrowLeft:[0xCB], ArrowRight:[0xCD],
  Home:[0xC7], End:[0xCF], PageUp:[0xC9], PageDown:[0xD1], Insert:[0xD2], Delete:[0xD3],
};
for (let i = 1; i <= 12; i++) KEY["F" + i] = [SC["F" + i]];
for (const [sc, plain, shifted] of [[0x02, "1234567890-=", "!@#$%^&*()_+"], [0x10, "qwertyuiop[]", "QWERTYUIOP{}"],
    [0x1E, "asdfghjkl;'`", "ASDFGHJKL:\"~"], [0x2C, "zxcvbnm,./", "ZXCVBNM<>?"], [0x2B, "\\", "|"]]) {
  [...plain].forEach((c, i) => { KEY[c] = [sc + i, false]; });
  [...shifted].forEach((c, i) => { KEY[c] = [sc + i, true]; });
}

const $ = (id) => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d"), wrap = $("screen-wrap");
let ws = null, backoff = 500, frames = 0, decoding = false, pending = null;
const down = new Set();

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function setMeta(m) {
  if (canvas.width !== m.w || canvas.height !== m.h) { canvas.width = m.w; canvas.height = m.h; }
  // Game Link pixel aspect: displayed height = h * parY / parX.
  const dispH = m.h * (m.parY || 1) / (m.parX || 1);
  canvas.style.aspectRatio = `${m.w} / ${dispH}`;
  $("prog").textContent = m.program ? `▶ ${m.program}` : "";
  $("geom").textContent = `${m.w}×${m.h}`;
}

async function draw(buf) {
  if (decoding) { pending = buf; return; }   // keep only the newest frame
  decoding = true;
  try {
    const bmp = await createImageBitmap(new Blob([buf], { type: "image/jpeg" }));
    ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
    bmp.close();
    frames++;
  } catch (e) { /* ignore a bad frame */ }
  decoding = false;
  if (pending) { const p = pending; pending = null; draw(p); }
}

function connect() {
  const url = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${location.pathname.replace(/[^/]*$/, "")}ws`;
  ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { backoff = 500; $("dot").classList.add("on"); $("conn").textContent = "connected"; };
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") { const m = JSON.parse(ev.data); if (m.type === "meta") setMeta(m); }
    else draw(ev.data);
  };
  ws.onclose = () => {
    $("dot").classList.remove("on"); $("conn").textContent = "reconnecting…";
    down.clear();
    setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 8000);
  };
}

setInterval(() => { $("fps").textContent = `${frames} fps`; frames = 0; }, 1000);

// Keyboard: active while the screen has focus.
wrap.addEventListener("focus", () => wrap.classList.add("focused"));
wrap.addEventListener("blur", () => { wrap.classList.remove("focused"); releaseAll(); });
const synthShift = new Set();               // fallback keys we wrapped in our own Shift press
function key(e, isDown) {
  let sc = SC[e.code], shift = false;
  if (sc === undefined && !e.code) [sc, shift] = KEY[e.key] || KEY[(e.key || "").toLowerCase()] || [];
  if (sc === undefined) return;
  e.preventDefault();
  if (isDown && e.repeat) return;           // DOS does its own typematic repeat
  if (isDown) {
    // e.g. ":" from a code-less event without a Shift key event before it
    if (shift && !down.has(0x2A) && !down.has(0x36)) { send({ k: 0x2A, d: true }); synthShift.add(sc); }
    down.add(sc);
    send({ k: sc, d: true });
  } else {
    down.delete(sc);
    send({ k: sc, d: false });
    if (synthShift.delete(sc) && !synthShift.size) send({ k: 0x2A, d: false });
  }
}
wrap.addEventListener("keydown", (e) => key(e, true));
wrap.addEventListener("keyup", (e) => key(e, false));
function releaseAll() {
  for (const sc of down) send({ k: sc, d: false });
  if (synthShift.size) send({ k: 0x2A, d: false });
  down.clear(); synthShift.clear(); send({ b: 0 });
}
$("release").onclick = () => { releaseAll(); wrap.focus(); };
$("cad").onclick = () => {
  for (const sc of [0x1D, 0x38, 0xD3]) send({ k: sc, d: true });
  setTimeout(() => { for (const sc of [0xD3, 0x38, 0x1D]) send({ k: sc, d: false }); }, 100);
  wrap.focus();
};

// Mouse: relative motion via pointer lock, batched per animation frame.
let mdx = 0, mdy = 0, rafQueued = false;
$("mouse").onclick = () => canvas.requestPointerLock();
canvas.addEventListener("click", () => wrap.focus());
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
const locked = () => document.pointerLockElement === canvas;
document.addEventListener("pointerlockchange", () => {
  $("mouse").textContent = locked() ? "Mouse captured (Esc)" : "Capture mouse";
  if (locked()) wrap.focus(); else send({ b: 0 });
});
document.addEventListener("mousemove", (e) => {
  if (!locked()) return;
  mdx += e.movementX; mdy += e.movementY;
  if (!rafQueued) {
    rafQueued = true;
    requestAnimationFrame(() => { rafQueued = false; if (mdx || mdy) send({ m: [mdx, mdy] }); mdx = mdy = 0; });
  }
});
for (const t of ["mousedown", "mouseup"]) {
  document.addEventListener(t, (e) => { if (locked()) { e.preventDefault(); send({ b: e.buttons & 7 }); } });
}

connect();
</script>
</body>
</html>
