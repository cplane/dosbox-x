server {
    # 8080, not 80, so the container runs without NET_BIND_SERVICE.
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads to a box's C: drive (the gateway enforces the box's own limit).
    client_max_body_size 256m;

    # The scheme the user used, not the one this pod saw: TLS terminates at
    # the load balancer, so $scheme is always "http" here. The auth service
    # reads X-Forwarded-Proto to decide whether cookies get Secure.
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto) {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    # The player socket gets its own location so the upgrade headers are set
    # only where they belong.
    location ~ ^/api/boxes/[^/]+/ws$ {
        proxy_pass http://${GATEWAY_HOST}:${GATEWAY_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Stays open as long as someone watches the box.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # The auth service on the SAME origin as the page, so the session cookie
    # is host-only, httpOnly and SameSite=Lax with no CORS anywhere.
    location /auth/ {
        proxy_pass http://${AUTH_HOST}:${AUTH_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/ {
        proxy_pass http://${GATEWAY_HOST}:${GATEWAY_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # SPA routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
